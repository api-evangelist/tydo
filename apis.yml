aid: tydo
name: Tydo
description: 'Tydo delivers autonomous audits for Shopify stores inside Claude. A single integration
  runs hundreds of audits - retention, shipping, email and SMS, and more - scoring a store against
  similar brands in its network, re-running on a cadence in the background, and routing every finding
  to a next step: fix it yourself, turn on an agent, or get matched to a vetted partner via dtcmvp.
  A Greylock portfolio company, currently waitlist-only with no public developer portal, API
  documentation, or published MCP endpoint.'
